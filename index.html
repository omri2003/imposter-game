<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imposter</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  /* Layout: one centered column, a single big tap card per player. Single dark "game night" look. */
  :root {
    color-scheme: dark;
    --bg: #14131a; --fg: #f1eff7; --muted: #8d8a9c; --line: #2a2833;
    --blue: #2f6bff; --red: #ff3b4a; --gray: #3a3844;
    --tonal: #26242e; --surface: #1d1b25; --accent: #7aa2ff;
    --display: "Bricolage Grotesque", system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--display);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px; box-sizing: border-box;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 440px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  #setup, #home, #room { height: auto; min-height: 100%; gap: 16px; }
  h1 { font-size: 2.4rem; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--red); }
  .label { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .stepper { direction: ltr; display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 16px; padding: 8px; }
  .stepper output { font-size: 3.5rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stepper button { width: 64px; height: 64px; font-size: 2rem; border-radius: 12px; background: var(--line); color: var(--fg); border: 0; }
  .hint { color: var(--muted); font-size: .95rem; margin: 0; }
  .go { height: 64px; border: 0; border-radius: 16px; background: var(--fg); color: var(--bg); font: 800 1.3rem var(--display); }
  .tonal { min-height: 52px; border: 0; border-radius: 16px; background: var(--tonal); color: var(--fg); font: 500 1rem var(--display); }
  .txt { min-height: 48px; min-width: 48px; padding: 0 8px; border: 0; background: none; color: var(--accent); font: 500 1rem var(--display); align-self: flex-start; }
  .card { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .sec { display: flex; flex-direction: column; gap: 8px; }
  h2.label { margin: 0; font-weight: 500; }
  .err { color: var(--red); margin: 0; }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .count { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { height: 48px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); font: 500 .95rem var(--display); }
  .chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  #q, .nm, #cc { height: 48px; border: 1px solid var(--line); border-radius: 12px; background: none; color: var(--fg); font: 500 1rem var(--display); padding: 0 14px; -webkit-user-select: text; user-select: text; }
  #words { max-height: 40vh; min-height: 120px; overflow-y: auto; border: 1px solid var(--line); border-radius: 16px; }
  #words label { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 1.05rem; }
  #words label.off span { color: var(--muted); text-decoration: line-through; }
  #words input { width: 22px; height: 22px; accent-color: var(--blue); }
  #words .hint { padding: 14px; }
  #words small { color: var(--muted); font-size: .8rem; }
  #words .txt { align-self: center; margin-inline-start: auto; }
  .aw { display: flex; flex-wrap: wrap; gap: 8px; }
  .aw .nm { flex: 1 1 100%; } .aw #cc { flex: 1 1 0; min-width: 0; width: auto; background: var(--surface); }
  .aw .tonal { padding: 0 20px; }
  #wcount.warn { color: var(--red); }
  #card, #ocard {
    flex: 1; border: 0; border-radius: 28px; background: var(--gray); color: var(--fg);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    font: 800 1.6rem var(--display); text-align: center; padding: 24px; transition: background .15s;
  }
  #card.blue, #ocard.blue { background: var(--blue); }
  #card.red, #ocard.red { background: var(--red); }
  #card .word, #ocard .word { font-size: 2.6rem; line-height: 1.05; text-wrap: balance; }
  #card small, #ocard small { font-size: 1rem; font-weight: 500; opacity: .75; }
  #end { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .endq { font-size: 1.5rem; font-weight: 800; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; }
  @media (prefers-reduced-motion: reduce) { #card, #ocard { transition: none; } }
  .opt { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; font-size: 1.05rem; }
  .opt input { width: 22px; height: 22px; accent-color: var(--blue); }
  .sub { display: flex; flex-direction: column; gap: 16px; }
  .nm { width: 100%; box-sizing: border-box; }
  #names { display: flex; flex-direction: column; gap: 8px; }
  #first, #ofirst { font-size: 1.8rem; font-weight: 800; text-align: center; }
  #clock, #oclock { font-size: 4rem; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums; border-radius: 16px; }
  #clock.up, #oclock.up { font-size: 2rem; color: var(--red); animation: flash .6s steps(2) infinite; }
  @keyframes flash { 50% { background: var(--red); color: var(--fg); } }
  #wordline, #owordline { font-size: 1.2rem; text-align: center; }
  #wordline b, #impline b, #owordline b, #oimpline b { display: block; font-size: 2.4rem; line-height: 1.1; }
  #impline, #oimpline { text-align: center; color: var(--red); font-size: 1.1rem; }
  .go:disabled { opacity: .35; }
  .cfg { display: flex; flex-direction: column; gap: 16px; }
  .cj { display: flex; gap: 8px; }
  #code { flex: none; min-width: 0; width: 100%; box-sizing: border-box; height: 52px; direction: ltr; text-align: center; text-transform: uppercase; letter-spacing: .3em; font-size: 1.4rem; font-weight: 800; }
  .cj { flex-wrap: wrap; } .cj .tonal { padding: 0 20px; flex: 1 0 auto; }
  #tbox, #post, #opost { display: flex; flex-direction: column; gap: 8px; }
  #tbox { gap: 12px; }
  #rcode, #invcode { font-size: 3.5rem; font-weight: 800; letter-spacing: .12em; text-align: center; direction: ltr; -webkit-user-select: text; user-select: text; }
  #plist { padding: 4px 16px; gap: 0; }
  .pl { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line); font-size: 1.05rem; }
  .pl:last-child { border-bottom: 0; }
  .pl small { color: var(--muted); font-size: .9rem; }
  .qr { width: min(220px, 100%); aspect-ratio: 1; align-self: center; background: #fff; border-radius: 16px; overflow: hidden; }
  .qr svg { display: block; width: 100%; height: 100%; }
  .ctr { align-items: center; text-align: center; }
  .ctr > .tonal, .ctr > .nm, .ctr > .go { align-self: stretch; }
  .bot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  #obelow { display: flex; flex-direction: column; gap: 12px; }
  #ogame.rev #obelow { flex: 1; justify-content: center; }
  #ogame, #room { height: auto; min-height: 100%; }
  .vrow { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 56px; padding: 0 16px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 16px; background: none; color: var(--fg); font: 500 1.1rem var(--display); text-align: start; }
  .vrow i { flex: none; width: 24px; height: 24px; box-sizing: border-box; border-radius: 50%; border: 2px solid var(--muted); }
  .vrow[aria-pressed="true"] { border-color: var(--accent); background: var(--surface); }
  .vrow[aria-pressed="true"] i { background: var(--accent); border-color: var(--accent); }
  .pts { font-variant-numeric: tabular-nums; font-weight: 800; }
  .vl { padding: 4px 16px; gap: 0; }
  #gtext, #resline { overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { #clock.up, #oclock.up { animation: none; } }
</style>
</head>
<body>

<main id="home">
  <h1>Imp<span>o</span>ster</h1>
  <div class="chips langs"></div>
  <div class="sec">
    <label class="label" for="name" data-t="yourName"></label>
    <input class="nm" id="name" maxlength="16" data-ph="namePh" autocomplete="off">
    <p class="hint err" id="errName" hidden></p>
  </div>
  <div id="inv" hidden>
    <section class="sec">
      <h2 class="label" id="invT"></h2>
      <div class="card ctr">
        <div id="invcode"></div>
        <button class="go" id="joinInv" data-t="join"></button>
      </div>
    </section>
    <button class="txt" id="hostNew" data-t="hostInstead"></button>
  </div>
  <div id="normal" style="display:contents">
    <section class="sec">
      <label class="label" for="code" data-t="codeHint"></label>
      <input class="nm" id="code" maxlength="4" data-ph="codePh" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <p class="hint err" id="errCode" hidden></p>
    </section>
    <button class="go" id="create"></button>
  </div>
  <p class="hint err" id="errNet" hidden></p>
  <button class="txt" id="local" data-t="onePhone"></button>
</main>

<main id="setup" hidden>
  <button class="txt" id="tohome" data-t="back"></button>
  <h1>Imp<span>o</span>ster</h1>
  <div class="chips langs"></div>
  <div class="label" data-t="players"></div>
  <div class="stepper">
    <button id="minus" aria-label="−">−</button>
    <output id="n">5</output>
    <button id="plus" aria-label="+">+</button>
  </div>
  <div id="names" hidden></div>
  <div class="cfg" id="cfg">
    <div class="sub" id="impbox" hidden>
      <div class="label" data-t="imposters"></div>
      <div class="stepper">
        <button id="iminus" aria-label="−">−</button>
        <output id="ni">1</output>
        <button id="iplus" aria-label="+">+</button>
      </div>
    </div>
    <p class="hint" id="split"></p>
    <div class="label" data-t="options"></div>
    <div id="opts">
      <label class="opt"><span data-t="optCat"></span><input type="checkbox" data-o="cat"></label>
      <label class="opt"><span data-t="optFirst"></span><input type="checkbox" data-o="first"></label>
      <label class="opt" id="optNamesRow"><span data-t="optNames"></span><input type="checkbox" data-o="names"></label>
      <div class="opt"><span data-t="optTimer"></span></div>
      <div class="chips" id="tmr"></div>
    </div>
    <div class="label" data-t="cats"></div>
    <div class="chips" id="cats"></div>
    <div class="sec">
      <label class="label" for="cw" data-t="addLbl"></label>
      <div class="aw">
        <input class="nm" id="cw" maxlength="40" autocomplete="off">
        <select class="nm" id="cc" data-ph="cats"></select>
        <button class="tonal" id="cwadd" data-t="add"></button>
      </div>
      <p class="hint" id="cwhint" hidden data-t="dup"></p>
    </div>
    <div class="row"><span class="label" data-t="words"></span><span class="hint" id="wcount"></span></div>
    <input id="q" type="search" data-ph="search">
    <div id="words"></div>
  </div>
  <button class="go" id="start" data-t="start"></button>
</main>

<main id="room" hidden>
  <button class="txt" id="leave" data-t="leave"></button>
  <div class="card ctr">
    <div class="qr" id="qrbox" role="img" hidden></div>
    <div class="hint" id="qrcap" data-t="scan" hidden></div>
    <div id="rcode"></div>
    <button class="tonal" id="copy" data-t="copyLink"></button>
    <input class="nm" id="link" readonly hidden aria-label="link">
  </div>
  <section class="sec">
    <h2 class="label" id="plabel"></h2>
    <div class="card" id="plist"></div>
  </section>
  <p class="hint" id="wait" hidden data-t="waiting"></p>
  <section class="sec" id="lscores" hidden>
    <h2 class="label" data-t="scores"></h2>
    <div class="card vl" id="lscorelist"></div>
  </section>
  <div id="cfgslot"></div>
  <div class="bot">
    <p class="hint" id="need" hidden data-t="need3"></p>
    <button class="go" id="ostart" data-t="start" hidden></button>
  </div>
</main>

<main id="ogame" hidden>
  <button class="txt" id="oleave" data-t="leave"></button>
  <div class="row"><span class="label" data-t="roundLbl"></span><span class="count" id="seen"></span></div>
  <button id="ocard"></button>
  <p class="endq" id="onot" hidden data-t="inProgress"></p>
  <div id="obelow">
    <div id="ofirst" hidden></div>
    <div id="oclock" hidden></div>
    <div id="owordline" hidden></div>
    <div id="oimpline" hidden></div>
    <button class="tonal" id="otstart" data-t="startTimer" hidden></button>
    <button class="go" id="ovstart" data-t="startVote" hidden></button>
    <button class="txt" id="oreveal" data-t="revealNoVote" hidden></button>
    <section class="sec" id="ovote" hidden>
      <p class="endq" data-t="voteQ"></p>
      <div class="sec" id="vlist"></div>
      <button class="tonal" id="oendvote" data-t="endVote" hidden></button>
    </section>
    <section class="sec" id="oguess" hidden>
      <p class="endq" id="gwho"></p>
      <div class="sec" id="gform">
        <label class="label" for="gin" data-t="guessLbl"></label>
        <input class="nm" id="gin" maxlength="40" autocomplete="off">
        <button class="go" id="gsend" data-t="sendGuess"></button>
      </div>
      <div class="sec" id="ojudge">
        <button class="go" id="ocorrect" data-t="correct"></button>
        <button class="tonal" id="owrong" data-t="wrong"></button>
      </div>
      <p class="hint" id="gwait" data-t="judging"></p>
    </section>
    <p class="endq" id="gtext" hidden></p>
    <div class="sec" id="ores" hidden>
      <p class="endq" id="resline"></p>
      <section class="sec" id="vsec"><h2 class="label" data-t="votesLbl"></h2><div class="card vl" id="vlog"></div></section>
    </div>
    <section class="sec" id="oscores" hidden>
      <h2 class="label" data-t="scores"></h2>
      <div class="card vl" id="oscorelist"></div>
    </section>
    <div id="opost" hidden>
      <p class="endq" data-t="removeQ"></p>
      <button class="go" id="orm" data-t="rmN"></button>
      <button class="tonal" id="okeep" data-t="keepN"></button>
      <button class="txt" id="oback" data-t="toLobby"></button>
    </div>
    <p class="hint" id="owaitp" hidden data-t="waiting"></p>
  </div>
</main>

<main id="game" hidden>
  <button class="txt" id="quit" data-t="quit"></button>
  <div class="row"><span class="label" data-t="pass"></span><span class="count" id="left"></span></div>
  <button id="card"></button>
  <div id="end" hidden>
    <div id="first" hidden></div>
    <div id="tbox" hidden>
      <div id="clock"></div>
      <button class="tonal" id="tstart" data-t="startTimer"></button>
    </div>
    <button class="go" id="reveal" data-t="reveal"></button>
    <div id="post" hidden>
      <div id="wordline"></div>
      <div id="impline"></div>
      <p class="endq" data-t="removeQ"></p>
      <button class="go" id="rm" data-t="rm"></button>
      <button class="tonal" id="keep" data-t="keep"></button>
    </div>
  </div>
</main>

function tick() {
  const s = Math.ceil((endAt - Date.now()) / 1000);
  if (s > 0) { $("clock").textContent = mmss(s); return; }
  stopT();
  $("clock").textContent = t("timesUp"); $("clock").className = "up";
  try { navigator.vibrate?.([500, 200, 500, 200, 500]); } catch {}
}
$("tstart").onclick = () => {
  $("tstart").hidden = true; endAt = Date.now() + opts.timer * 60000;
  stopT(); timerId = setInterval(tick, 250); tick();
};
$("reveal").onclick = () => {
  const imps = roles.flatMap((r, k) => r === "red" ? [nm(k)] : []);
  $("wordline").innerHTML = `${t("wasWord")}<b>${esc(word)}</b>`;
  $("impline").innerHTML = `${t("impLabel", imps.length)}: <b>${esc(imps.join(", "))}</b>`;
  $("reveal").hidden = true; $("post").hidden = false;
};

$("card").onclick = () => {
  if (busy) return;
  if (waiting) { waiting = false; return idle(); }   // color showing → tap hides it, next player
  const r = roles[i++];
  waiting = busy = true;
  setTimeout(() => busy = false, 400);   // ponytail: stops a double-tap hiding the color instantly
  $("card").className = r;
  $("card").innerHTML = r === "red"
    ? `<span class="word">${t("imposter")}</span>${opts.cat ? `<small>${esc(t("category", wordCat))}</small>` : ""}<small>${t("blend")}</small>`
    : `<small>${t("wordIs")}</small><span class="word">${esc(word)}</span><small>${t("tapHide")}</small>`;
};

$("minus").onclick = () => setN(n - 1);
$("plus").onclick = () => setN(n + 1);
$("iminus").onclick = () => { nImp--; syncImp(); };
$("iplus").onclick = () => { nImp++; syncImp(); };
$("start").onclick = newRound;
$("quit").onclick = () => { stopT(); render(); show("setup"); };
$("rm").onclick = () => { excluded.add(word); save("excluded_" + lang, excluded); render(); newRound(); };
$("keep").onclick = newRound;
// ===== Online rooms: Supabase Realtime broadcast + presence only (no tables) =====
const SB_URL = "https://rmmojdxoodamrumenitm.supabase.co";
const SB_KEY = "sb_publishable_z5t-Ln7K7GrzVK4SvMNnPg_PdVyC9g_";
const SB_LEGACY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtbW9qZHhvb2RhbXJ1bWVuaXRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNDI5NDYsImV4cCI6MjEwNzcxODk0Nn0.gbfYDuiSMld5qh9rIarlW9tOuWMb4wGpN0ehCvafMFQ";
const KEYS = [SB_KEY, SB_LEGACY];   // publishable key first, legacy anon key if realtime rejects it
let nfTimer = 0, inviteCode = "", qrFor = "", ki = 0, cli = null, ch = null, code = "", myName = "", joinedAt = 0, joining = false, players = {}, R = null, obusy = false, scores = {};
// R = current round: the "round" payload + seen:Set, revealed, endAt, done, v (0 hidden / 1 showing / 2 gray),
// voting, votes {from: to}, voteEnded, votedOut, guess (null = none yet), result, sent (host-only send-once keys).
// scores = {id: {name, pts}} lives for the whole room visit. Every client keeps both, so any can become host.
const myId = (() => {
  let v = loadJ("myId", "");
  if (typeof v !== "string" || v.length < 8) { v = Array.from({ length: 12 }, () => rnd(36).toString(36)).join(""); saveJ("myId", v); }
  return v;
})();

// host = present player with the smallest joinedAt (tie → smaller id); leaving host hands over automatically
const order = ps => Object.keys(ps).sort((a, b) => ps[a].joinedAt - ps[b].joinedAt || (a < b ? -1 : 1));
const hostOf = ps => order(ps)[0];
const genCode = () => { const A = "ABCDEFGHJKMNPQRSTUVWXYZ"; return Array.from({ length: 4 }, () => A[rnd(A.length)]).join(""); };   // no I, O, L; ponytail: no collision check, 23^4 codes
const send = (event, payload) => ch?.send({ type: "broadcast", event, payload });
const err = k => { for (const [id, key] of [["errName", "errName"], ["errCode", "errCode"], ["errNet", "noNet"]]) { $(id).textContent = k === key ? t(k) : ""; $(id).hidden = k !== key; } };
const inviteUrl = () => location.href.split(/[?#]/)[0] + "?room=" + code;
// dark modules on white with a 4-module quiet zone, so it scans even in the dark theme; "" if the library didn't load
function qrSvg(url) {
  if (!window.qrcode) return "";
  const q = qrcode(0, "M"); q.addData(url); q.make();
  const k = q.getModuleCount(); let d = "";
  for (let r = 0; r < k; r++) for (let c = 0; c < k; c++) if (q.isDark(r, c)) d += `M${c + 4} ${r + 4}h1v1h-1z`;
  return `<svg viewBox="0 0 ${k + 8} ${k + 8}" shape-rendering="crispEdges" aria-hidden="true"><rect width="${k + 8}" height="${k + 8}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

function client() {
  while (!cli && window.supabase && ki < KEYS.length) { try { cli = supabase.createClient(SB_URL, KEYS[ki]); } catch { ki++; } }
  return cli;
}

function enter(c, create) {
  myName = $("name").value.trim().slice(0, 16);
  if (!myName) { err("errName"); return $("name").focus(); }
  if (!/^[A-Z]{4}$/.test(c)) { err("errCode"); return $("code").focus(); }
  saveJ("name", myName); err("");
  if (!client()) return err("noNet");
  code = c; joining = !create; joinedAt = Date.now(); R = null; players = {}; scores = {};
  $("cfgslot").append($("cfg")); $("optNamesRow").hidden = true;
  connect(); go();
}

function connect() {
  const c = ch = client().channel("imposter:" + code, { config: { broadcast: { self: true }, presence: { key: myId } } });
  const on = (ev, fn) => c.on("broadcast", { event: ev }, ({ payload }) => c === ch && fn(payload || {}));
  c.on("presence", { event: "sync" }, () => {
    if (c !== ch) return;
    players = {}; const st = c.presenceState();
    for (const k in st) players[k] = st[k][0];
    go();
  });
  on("round", onRound); on("seen", onSeen); on("timer", onTimer); on("reveal", onReveal); on("lobby", onLobby); on("sync", onSync);
  on("vote_start", onVoteStart); on("vote", onVote); on("vote_end", onVoteEnd); on("guess", onGuess); on("result", onResult); on("scores", onScores);
  c.subscribe(async st => {
    if (c !== ch) return;
    if (st === "SUBSCRIBED") { await c.track({ name: myName, joinedAt }); send("sync", { id: myId });
      clearTimeout(nfTimer);
      if (joining) nfTimer = setTimeout(() => { if (c === ch && !Object.keys(players).some(k => k !== myId)) notFound(); }, 4000);   // joined, still alone: wrong code
    }
    else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT") {
      if (ki < KEYS.length - 1) {   // retry once with the legacy key
        ki++; ch = null; try { cli.removeAllChannels(); } catch {} cli = null;
        if (client()) connect(); else { leave(); err("noNet"); }
      } else { leave(); err("noNet"); }
    }
  });
}

function notFound() {   // back to the normal home view (also from an invite card) with the code kept and an error under it
  const c = code; leave();
  inviteCode = ""; $("inv").hidden = true; $("normal").hidden = false;
  $("code").value = c; mainLbl();
  $("errCode").textContent = t("nf", c); $("errCode").hidden = false;
}

function leave() {
  const c = ch; ch = null; R = null; players = {}; scores = {}; stopT();
  try { cli?.removeChannel(c); } catch {}
  show("home");
}

// ---- incoming events ----
function onRound(p) {
  if (R && R.roundId === p.roundId) return;   // replay from a sync answer: already have it
  stopT();
  R = { ...p, seen: new Set(), revealed: false, endAt: 0, done: false, v: 0, voting: false, votes: {}, voteEnded: false, votedOut: null, guess: null, result: null, sent: new Set() };
  $("gin").value = "";
  go();
}
function onSeen(p) {
  if (R?.roundId !== p.roundId) return;
  [p.id, ...(p.ids || [])].forEach(x => x && R.seen.add(x));
  go();
}
function onTimer(p) {
  if (R?.roundId !== p.roundId || R.endAt === p.endAt) return;
  R.endAt = p.endAt; R.done = false; go();
}
function onReveal(p) { if (R?.roundId !== p.roundId) return; R.revealed = true; go(); }
function onLobby() { stopT(); R = null; go(); }
function onVoteStart(p) {   // also a sync replay: merge votes, local ones win
  if (R?.roundId !== p.roundId || R.revealed) return;
  stopT(); R.voting = true; R.votes = { ...(p.votes || {}), ...R.votes }; go();
}
function onVote(p) {
  if (R?.roundId !== p.roundId || !R.voting || R.voteEnded || R.revealed) return;
  const ok = id => R.players.some(x => x.id === id);
  if (!ok(p.from) || !ok(p.to) || p.from === p.to) return;
  R.votes[p.from] = p.to; go();
}
function onVoteEnd(p) { if (R?.roundId !== p.roundId || !R.voting || R.voteEnded) return; R.voteEnded = true; R.votedOut = p.votedOut || null; go(); }
function onGuess(p) {
  if (R?.roundId !== p.roundId || !R.voteEnded || R.result || R.guess !== null || p.from !== R.votedOut) return;
  R.guess = String(p.text || "").slice(0, 40); go();
}
function onResult(p) {
  if (R?.roundId !== p.roundId || R.result) return;
  R.result = p; R.votedOut = p.votedOut || null; R.revealed = true; scores = p.scores || {}; go();
}
function onScores(p) { scores = p.scores || {}; go(); }
async function onSync(p) {   // only the current host answers, with everything a newcomer needs
  if (p.id === myId || hostOf(players) !== myId) return;
  await send("scores", { scores });
  if (!R) return;
  const { seen, revealed, endAt, done, v, voting, votes, voteEnded, votedOut, guess, result, sent, ...rd } = R, roundId = R.roundId;
  await send("round", rd);
  await send("seen", { roundId, ids: [...seen] });
  if (endAt) await send("timer", { roundId, endAt });
  if (revealed && !voting) await send("reveal", { roundId });
  if (voting) await send("vote_start", { roundId, votes });
  if (voteEnded) await send("vote_end", { roundId, votedOut });
  if (guess !== null) await send("guess", { roundId, from: votedOut, text: guess });
  if (result) await send("result", result);
}

// ---- host: drive the vote, compute the result once ----
const once = k => !R.sent.has(k) && !!R.sent.add(k);
function endVote() { if (once("end")) send("vote_end", { roundId: R.roundId, votedOut: tally(R.votes) }); }
function sendResult(guessCorrect) {
  const o = outcome(R.reds, R.players.map(p => p.id), R.votedOut, guessCorrect), sc = { ...scores };
  for (const p of R.players) sc[p.id] = { name: p.name, pts: (scores[p.id]?.pts || 0) + (o.deltas[p.id] || 0) };
  send("result", { roundId: R.roundId, votedOut: R.votedOut, caught: o.caught, guessCorrect: guessCorrect ?? null, winner: o.winner, votes: R.votes, scores: sc });
}
const scoreList = () => Object.values(scores).sort((a, b) => b.pts - a.pts || a.name.localeCompare(b.name, lang))
  .map(s => `<div class="pl"><span>${esc(s.name)}</span><b class="pts">${s.pts}</b></div>`).join("");
const hasScore = () => Object.values(scores).some(s => s.pts > 0);

// ---- host: start a round from the host's own pool/options ----
function startRound() {
  const ids = order(players);
  const p = pool();
  if (ids.length < 3 || !p.length) return send("lobby", {});
  n = ids.length; syncImp();
  let pick;
  do pick = p[rnd(p.length)]; while (pick.w === lastWord && p.length > 1);
  lastWord = pick.w;
  const reds = [...pickReds(n, nImp)].map(k => ids[k]);
  send("round", {
    roundId: Date.now().toString(36) + rnd(1e6).toString(36), lang,
    players: ids.map(id => ({ id, name: players[id].name })), reds, word: pick.w,
    cat: CATS.find(c => c.id === pick.c)[lang],
    opts: { cat: !!opts.cat, first: !!opts.first, timer: opts.timer },
    firstId: opts.first ? ids[rnd(n)] : null,
  });
}

// ---- rendering ----
function go() {
  if (!ch) return;
  if (R) { show("ogame"); gameRender(); } else { show("room"); lobbyRender(); }
}

function lobbyRender() {
  const ids = order(players), host = hostOf(players) === myId;
  $("rcode").textContent = code;
  $("plabel").textContent = t("playersN", ids.length);
  $("plist").innerHTML = ids.map(id => `<div class="pl"><span>${esc(players[id].name)}</span><small>${esc([id === myId && t("you"), id === ids[0] && t("host")].filter(Boolean).join(" · "))}</small></div>`).join("");
  if (qrFor !== code) {
    qrFor = code; $("qrbox").innerHTML = qrSvg(inviteUrl());
    $("qrbox").hidden = $("qrcap").hidden = !$("qrbox").firstChild;
  }
  $("qrbox").setAttribute("aria-label", t("scan"));
  $("wait").hidden = host; $("cfg").hidden = !host;
  $("ostart").hidden = !host; $("ostart").disabled = ids.length < 3;
  $("need").hidden = !host || ids.length >= 3;
  if (host) { n = ids.length; syncImp(); }
  $("lscores").hidden = !hasScore(); $("lscorelist").innerHTML = scoreList();
}

function cardRender() {
  const c = $("ocard"), red = R.reds.includes(myId);
  if (R.v === 0) { c.className = ""; c.innerHTML = `${esc(myName)}<small>${esc(t("tapSee"))}</small>`; }
  else if (R.v === 2) { c.className = ""; c.textContent = t("tapAgain"); }
  else {
    c.className = red ? "red" : "blue";
    c.innerHTML = red
      ? `<span class="word">${esc(t("imposter"))}</span>${R.opts.cat ? `<small>${esc(t("category", R.cat))}</small>` : ""}<small>${esc(t("blend"))}</small>`
      : `<small>${esc(t("wordIs"))}</small><span class="word">${esc(R.word)}</span><small>${esc(t("tapHide"))}</small>`;
  }
}

function otick() {
  if (!R?.endAt) return;
  const s = Math.ceil((R.endAt - Date.now()) / 1000);   // ponytail: trusts host clock, ±few s skew between phones
  if (s > 0) { $("oclock").textContent = mmss(s); return; }
  stopT(); R.done = true;
  $("oclock").textContent = t("timesUp"); $("oclock").className = "up";
  try { navigator.vibrate?.([500, 200, 500, 200, 500]); } catch {}
}

function gameRender() {
  const host = hostOf(players) === myId, me = R.players.some(p => p.id === myId);
  const nameOf = id => R.players.find(p => p.id === id)?.name ?? "";
  const act = R.players.filter(p => players[p.id]), seenN = act.filter(p => R.seen.has(p.id)).length;   // absent players don't block "all seen"
  const vp = R.voting, ve = R.voteEnded, late = R.revealed || vp;
  const votedN = act.filter(p => R.votes[p.id]).length, gNeed = ve && !!R.votedOut && R.reds.includes(R.votedOut);
  if (host && vp && !R.revealed) {   // host moves the vote along (also right after a host handover)
    if (!ve) { if (act.length && votedN >= act.length) endVote(); }
    else if (!gNeed) { if (once("res")) sendResult(null); }
    else if (R.guess === null && !players[R.votedOut] && once("res")) sendResult(false);   // guesser left
  }
  $("seen").textContent = vp ? t("voted", votedN, act.length) : t("seen", seenN, act.length);
  $("ogame").classList.toggle("rev", R.revealed);
  $("ocard").hidden = late || !me;
  $("onot").hidden = late || me;
  if (me && !late) cardRender();
  const showFirst = !late && R.opts.first && R.firstId && act.length > 0 && seenN >= act.length;
  $("ofirst").hidden = !showFirst;
  if (showFirst) $("ofirst").textContent = t("starts", nameOf(R.firstId));
  const clk = $("oclock");
  clk.hidden = late || !R.opts.timer;
  if (late) stopT();
  else if (!R.endAt) { clk.textContent = mmss(R.opts.timer * 60); clk.className = ""; }
  else if (R.done) { clk.textContent = t("timesUp"); clk.className = "up"; }
  else if (!timerId) { timerId = setInterval(otick, 250); otick(); }
  $("otstart").hidden = !(host && R.opts.timer && !R.endAt && !late);
  $("ovstart").hidden = $("oreveal").hidden = !host || late;
  $("opost").hidden = !(host && R.revealed);
  $("ovote").hidden = !(vp && !ve && !R.revealed);
  if (!$("ovote").hidden) {
    $("vlist").innerHTML = !me ? "" : R.players.filter(p => p.id !== myId && players[p.id]).map(p =>
      `<button class="vrow" data-id="${esc(p.id)}" aria-pressed="${R.votes[myId] === p.id}"><i></i><span>${esc(p.name)}</span></button>`).join("");
    $("oendvote").hidden = !host;
  }
  const gs = gNeed && !R.result, mine = R.votedOut === myId, gIn = R.guess !== null;
  $("oguess").hidden = !gs;
  if (gs) {
    $("gwho").textContent = t("guessing", nameOf(R.votedOut));
    $("gwho").hidden = mine || gIn;
    $("gform").hidden = !mine || gIn;
    $("ojudge").hidden = !host || !gIn;
    $("gwait").hidden = host || !gIn;
  }
  $("gtext").hidden = !gIn;
  if (gIn) $("gtext").textContent = t("guessed", nameOf(R.votedOut), R.guess);
  const res = R.result;
  $("ores").hidden = !res;
  if (res) {
    $("resline").textContent = res.winner === "crew" ? t("resCrew", nameOf(res.votedOut)) : res.guessCorrect ? t("resGuess") : t("resNot", R.reds.map(nameOf).join(", "));
    $("vlog").innerHTML = Object.entries(res.votes).map(([f, to]) =>
      `<div class="pl"><span><bdi>${esc(nameOf(f))}</bdi> ${esc(t("arrow"))} <bdi>${esc(nameOf(to))}</bdi></span></div>`).join("");
    $("vsec").hidden = !$("vlog").firstChild;
  }
  $("oscores").hidden = !(R.revealed && hasScore());
  $("oscorelist").innerHTML = scoreList();
  $("owaitp").hidden = host || !R.revealed;
  $("owordline").hidden = $("oimpline").hidden = !R.revealed;
  if (R.revealed) {
    const imps = R.reds.map(nameOf);
    $("owordline").innerHTML = `${esc(t("wasWord"))}<b>${esc(R.word)}</b>`;
    $("oimpline").innerHTML = `${esc(t("impLabel", imps.length))}: <b>${esc(imps.join(", "))}</b>`;
  }
}

// ---- wiring ----
$("create").onclick = () => { const c = $("code").value.trim().toUpperCase(); c ? enter(c, false) : enter(genCode(), true); };
$("joinInv").onclick = () => enter(inviteCode, false);
$("hostNew").onclick = () => { inviteCode = ""; $("code").value = ""; mainLbl(); $("inv").hidden = true; $("normal").hidden = false; };
$("code").oninput = () => { $("code").value = $("code").value.toUpperCase().replace(/[^A-Z]/g, ""); err(""); mainLbl(); };
$("name").oninput = () => { err(""); saveJ("name", $("name").value.trim().slice(0, 16)); };
$("local").onclick = () => {
  $("setup").insertBefore($("cfg"), $("start")); $("cfg").hidden = false; $("optNamesRow").hidden = false;
  setN(n); show("setup");
};
$("tohome").onclick = () => show("home");
$("leave").onclick = $("oleave").onclick = leave;
$("ostart").onclick = startRound;
$("copy").onclick = async () => {
  const url = inviteUrl();
  try {
    await navigator.clipboard.writeText(url);
    $("copy").textContent = t("copied"); setTimeout(() => $("copy").textContent = t("copyLink"), 1500);
  } catch { $("link").hidden = false; $("link").value = url; $("link").select(); }
};
$("ocard").onclick = () => {
  if (obusy || !R) return;
  if (R.v === 1) R.v = 2;
  else {
    R.v = 1; obusy = true; setTimeout(() => obusy = false, 400);   // stops a double-tap hiding the color instantly
    if (!R.seen.has(myId)) send("seen", { id: myId, roundId: R.roundId });
  }
  cardRender();
};
$("otstart").onclick = () => send("timer", { roundId: R.roundId, endAt: Date.now() + R.opts.timer * 60000 });
$("oreveal").onclick = () => send("reveal", { roundId: R.roundId });
$("ovstart").onclick = () => send("vote_start", { roundId: R.roundId });
$("vlist").onclick = e => { const b = e.target.closest("[data-id]"); if (b && R) send("vote", { roundId: R.roundId, from: myId, to: b.dataset.id }); };
$("oendvote").onclick = () => R && endVote();
$("gsend").onclick = () => { const text = $("gin").value.trim(); if (text && R) send("guess", { roundId: R.roundId, from: myId, text }); };
$("gin").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) $("gsend").click(); };
$("ocorrect").onclick = () => R && once("res") && sendResult(true);
$("owrong").onclick = () => R && once("res") && sendResult(false);
$("oback").onclick = () => send("lobby", {});
$("okeep").onclick = startRound;
$("orm").onclick = () => {
  const ex = R.lang === lang ? excluded : load("excluded_" + R.lang);
  ex.add(R.word); save("excluded_" + R.lang, ex); render();
  startRound();
};

function initHome() {
  $("name").value = loadJ("name", "");
  const r = (new URLSearchParams(location.search).get("room") || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);
  if (r) { inviteCode = r; $("code").value = r; $("invcode").textContent = r; $("inv").hidden = false; $("normal").hidden = true; $("invT").textContent = t("joinRoomN", r); $("name").focus(); }
  show("home");
}

setLang(lang);
initHome();
navigator.wakeLock?.request("screen").catch(() => {});
</script>
