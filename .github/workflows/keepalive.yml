# Free Supabase projects pause after ~7 days without database activity.
# This reads one row from the keepalive table every day so game nights keep working.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the keepalive row
        run: |
          curl -fsS "https://rmmojdxoodamrumenitm.supabase.co/rest/v1/keepalive?select=id" \
            -H "apikey: sb_publishable_z5t-Ln7K7GrzVK4SvMNnPg_PdVyC9g_"
